[project]
name = "cambodia-mse-intelligence"
version = "0.1.0"
description = "Cambodia MSE Intelligence - Department of Applied Mathematics and Statistics, ITC"
readme = "README.md"
authors = [
    { name = "DararithJ369", email = "192768443+DararithJ369@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "dbt-core>=1.9.0",
    "dbt-duckdb>=1.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "Faker>=24.0.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "nbformat>=5.9.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "requests>=2.31.0",
    "pytest>=8.0.0"
]

[project.scripts]
cambodia-mse-intelligence = "cambodia_mse_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

